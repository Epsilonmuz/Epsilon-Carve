name: Build Epsilon Carve (macOS)

# Manual or on version tags only, to save macOS minutes on a private repository.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE 9.0.5
        run: |
          if [ ! -f JUCE/CMakeLists.txt ]; then
            git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
          fi

      - name: Configure (universal, macOS 12.0)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build VST3, AU and engine tests
        run: cmake --build build --config Release --target EpsilonCarve_VST3 EpsilonCarve_AU CarveEngineTests -- -quiet

      - name: Engine tests
        run: (cd build && ctest -C Release --output-on-failure)

      - name: pluginval (strictness 5)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          VST3=$(find build -type d -name "Epsilon Carve.vst3" | head -1)
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --sample-rates 44100,48000 --validate-in-process --skip-gui-tests "$VST3"

      - name: Package
        run: |
          mkdir -p out
          cp -R "$(find build -type d -name 'Epsilon Carve.vst3' | head -1)" out/
          cp -R "$(find build -type d -name 'Epsilon Carve.component' | head -1)" out/
          cat > out/INSTALL.txt <<'TXT'
          Epsilon Carve v0.4.0 (unsigned test build)
          1. Copy "Epsilon Carve.vst3" to ~/Library/Audio/Plug-Ins/VST3/
             and "Epsilon Carve.component" to ~/Library/Audio/Plug-Ins/Components/
          2. This build is not notarised. Remove the download quarantine in Terminal:
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Epsilon Carve.vst3"
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/"Epsilon Carve.component"
          3. FL Studio: Options > Manage plugins > Find installed plugins.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: Epsilon-Carve-v0.4.0-macOS
          path: out
